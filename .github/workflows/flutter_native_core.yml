name: Flutter Native SDR++ Core

on:
  push:
    branches:
      - flutter-native-core
  workflow_dispatch:

concurrency:
  group: flutter-native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native SDR++ DSP bridge
        run: cmake -S mobile/native -B build/native-host -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile native SDR++ DSP bridge
        run: cmake --build build/native-host --parallel 2
      - name: Run native DSP smoke tests
        run: ctest --test-dir build/native-host --output-on-failure

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_ui
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --org com.smallfishworld --project-name sdrpp_flutter --platforms=android .

      - name: Enable Android network and USB host access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />')
          if "android.hardware.usb.host" not in s:
              s = s.replace(
                  '<application',
                  '    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n\n'
                  '    <application',
                  1)
          s = s.replace('android:label="sdrpp_flutter"', 'android:label="SDR++ Receiver"')
          p.write_text(s)
          PY

          mkdir -p android/app/src/main/kotlin/com/smallfishworld/sdrpp_flutter
          cp ../tooling/flutter_android/MainActivity.kt              android/app/src/main/kotlin/com/smallfishworld/sdrpp_flutter/MainActivity.kt

      - name: Generate SDR++ Receiver branding
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 ../tooling/generate_branding.py

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android RTL-SDR USB dependencies
        shell: bash
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"

          DEPS="$PWD/build/rtl-sdr-usb-deps"
          rm -rf "$DEPS"
          mkdir -p "$DEPS"
          cd "$DEPS"

          git clone --depth 1 --branch v1.0.27             https://github.com/libusb/libusb.git libusb

          pushd libusb/android/jni
          "$NDK/ndk-build"             NDK_PROJECT_PATH=..             APP_ABI=arm64-v8a             APP_PLATFORM=android-24
          popd

          LIBUSB_SO="$DEPS/libusb/android/libs/arm64-v8a/libusb1.0.so"
          test -f "$LIBUSB_SO"

          git clone --depth 1             https://github.com/AlexandreRouma/rtl-sdr.git rtl-sdr

          cmake             -S rtl-sdr             -B rtl-sdr-build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DBUILD_UTILITIES=OFF             -DINSTALL_UDEV_RULES=OFF             -DLIBUSB_LIBRARIES="$LIBUSB_SO"             -DLIBUSB_INCLUDE_DIRS="$DEPS/libusb/libusb"             -DLIBUSB_INCLUDE_DIR="$DEPS/libusb/libusb"             -DLIBUSB_FOUND=1
          cmake --build rtl-sdr-build --parallel 2

          RTLSDR_SO="$(find rtl-sdr-build -name 'librtlsdr.so' -type f | head -n 1)"
          test -n "$RTLSDR_SO"
          test -f "$RTLSDR_SO"

          mkdir -p "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a"
          cp "$LIBUSB_SO"              "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/libusb1.0.so"
          cp "$RTLSDR_SO"              "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/librtlsdr.so"

          file             "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/libusb1.0.so"             "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/librtlsdr.so"

      - name: Build Android SoapySDR runtime and RTL-SDR module
        shell: bash
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"

          DEPS="$PWD/build/rtl-sdr-usb-deps"
          SOAPY_PREFIX="$DEPS/soapy-install"
          RTLSDR_SO="$(find "$DEPS/rtl-sdr-build" -name 'librtlsdr.so' -type f | head -n 1)"
          test -f "$RTLSDR_SO"

          cd "$DEPS"
          git clone --depth 1 https://github.com/pothosware/SoapySDR.git soapy

          # Android APKs do not package ELF-style .so.<ABI> names from
          # jniLibs. Keep an unversioned SONAME and build only the runtime
          # library required by SDR++ Receiver.
          python3 - <<'PY'
          from pathlib import Path
          top = Path("soapy/CMakeLists.txt")
          text = top.read_text()
          for line in (
              "add_subdirectory(apps)",
              "add_subdirectory(tests)",
              "add_subdirectory(docs)",
              "add_subdirectory(swig)",
              "add_subdirectory(luajit)",
          ):
              text = text.replace(line, "# mobile runtime: " + line)
          top.write_text(text)

          lib = Path("soapy/lib/CMakeLists.txt")
          text = lib.read_text()
          text = text.replace(
              'set_target_properties(SoapySDR PROPERTIES SOVERSION ${SOAPY_SDR_ABI_VERSION})',
              '# mobile APK uses unversioned SoapySDR SONAME')
          text = text.replace(
              'set_target_properties(SoapySDR PROPERTIES VERSION ${SOAPY_SDR_LIBVER})',
              '# mobile APK uses unversioned SoapySDR filename')
          lib.write_text(text)

          # Android bionic does not provide POSIX glob(). The receiver loads
          # packaged Soapy modules explicitly with dlopen(), so the standard
          # filesystem module scan can be a no-op on Android.
          modules = Path("soapy/lib/Modules.in.cpp")
          text = modules.read_text()
          text = text.replace(
              '#include <dlfcn.h>\n#include <glob.h>',
              '#include <dlfcn.h>\n#ifndef __ANDROID__\n#include <glob.h>\n#endif')
          text = text.replace(
              '#ifdef _WIN32\n    //http://stackoverflow.com/questions/612097/how-can-i-get-a-list-of-files-in-a-directory-using-c-or-c',
              '#if defined(__ANDROID__)\n    (void)path;\n#elif defined(_WIN32)\n    //http://stackoverflow.com/questions/612097/how-can-i-get-a-list-of-files-in-a-directory-using-c-or-c')
          modules.write_text(text)
          PY

          cmake             -S soapy             -B soapy-build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$SOAPY_PREFIX"
          cmake --build soapy-build --parallel 2
          cmake --install soapy-build

          git clone --depth 1 https://github.com/pothosware/SoapyRTLSDR.git soapy-rtlsdr
          cmake             -S soapy-rtlsdr             -B soapy-rtlsdr-build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$SOAPY_PREFIX"             -DSoapySDR_DIR="$SOAPY_PREFIX/share/cmake/SoapySDR"             -DRTLSDR_FOUND=TRUE             -DRTLSDR_LIBRARIES="$RTLSDR_SO"             -DRTLSDR_INCLUDE_DIRS="$DEPS/rtl-sdr/include"
          cmake --build soapy-rtlsdr-build --parallel 2
          cmake --install soapy-rtlsdr-build

          # SoapyRemote gives the Android client a universal network path to
          # any SDR supported by SoapySDR on a desktop/server, including
          # hardware whose vendor SDK cannot be embedded on Android.
          git clone --depth 1 https://github.com/pothosware/SoapyRemote.git soapy-remote
          python3 - <<'PY'
          from pathlib import Path

          p = Path("soapy-remote/CMakeLists.txt")
          text = p.read_text()
          text = text.replace("add_subdirectory(server)", "# mobile client only")
          text = text.replace(
              'if(CMAKE_SYSTEM_NAME STREQUAL "Linux")\n    add_subdirectory(system)\nendif()',
              '# mobile client: no system service')
          p.write_text(text)

          # Android bionic intentionally has no gethostid(). SoapyRemote only
          # uses it as 32 bits of entropy for a generated client UUID. Supply a
          # stable process-local replacement based on hostname so the upstream
          # UUID layout and protocol remain unchanged.
          info = Path("soapy-remote/common/SoapyInfoUtils.in.cpp")
          text = info.read_text()
          marker = '#endif //_MSC_VER\n'
          android = r'''
#ifndef _MSC_VER
#ifdef __ANDROID__
static unsigned int gethostid(void)
{
    char host[128] = {0};
    if (gethostname(host, sizeof(host) - 1) != 0)
    {
        return 0x534F4150u; // "SOAP"
    }

    // FNV-1a 32-bit, sufficient for UUID node entropy.
    unsigned int hash = 2166136261u;
    for (const unsigned char *p = (const unsigned char *)host; *p; ++p)
    {
        hash ^= *p;
        hash *= 16777619u;
    }
    return hash;
}
#endif
#endif
'''
          if android.strip() not in text:
              text = text.replace(marker, marker + android)
          info.write_text(text)
          PY
          grep -q "static unsigned int gethostid" \
            soapy-remote/common/SoapyInfoUtils.in.cpp

          cmake \
            -S soapy-remote \
            -B soapy-remote-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SOAPY_PREFIX" \
            -DSoapySDR_DIR="$SOAPY_PREFIX/share/cmake/SoapySDR" \
            -DENABLE_AVAHI=OFF
          cmake --build soapy-remote-build --parallel 2
          cmake --install soapy-remote-build

          SOAPY_SO="$(find "$SOAPY_PREFIX" -name 'libSoapySDR.so' -type f | head -n 1)"
          SOAPY_RTL="$(find "$SOAPY_PREFIX" -name 'librtlsdrSupport.so' -type f | head -n 1)"
          SOAPY_REMOTE="$(find "$SOAPY_PREFIX" -name 'libremoteSupport.so' -type f | head -n 1)"
          test -f "$SOAPY_SO"
          test -f "$SOAPY_RTL"
          test -f "$SOAPY_REMOTE"

          JNI="$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          cp "$SOAPY_SO" "$JNI/libSoapySDR.so"
          cp "$SOAPY_RTL" "$JNI/librtlsdrSupport.so"
          cp "$SOAPY_REMOTE" "$JNI/libremoteSupport.so"

          file \
            "$JNI/libSoapySDR.so" \
            "$JNI/librtlsdrSupport.so" \
            "$JNI/libremoteSupport.so"
          readelf -d "$JNI/librtlsdrSupport.so" | grep NEEDED || true
          readelf -d "$JNI/libremoteSupport.so" | grep NEEDED || true

      - name: Build official SDR++ DSP native bridge
        shell: bash
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"
          cmake             -S ../mobile/native             -B build/sdrpp-native-arm64             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdrpp-native-arm64 --parallel 2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/sdrpp-native-arm64/libsdrpp_mobile.so              android/app/src/main/jniLibs/arm64-v8a/libsdrpp_mobile.so
          file android/app/src/main/jniLibs/arm64-v8a/libsdrpp_mobile.so

      - name: Verify complete SDR++ module mapping
        run: python3 ../tooling/check_module_catalog.py

      - name: Analyze Flutter app
        run: flutter analyze lib

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Name release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk              build/app/outputs/flutter-apk/SDRPP-Receiver-v0.6.0-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SDRPP-Receiver-Android
          path: flutter_ui/build/app/outputs/flutter-apk/SDRPP-Receiver-v0.6.0-native.apk
