name: Flutter Native SDR++ Core

on:
  push:
    branches:
      - flutter-native-core
  workflow_dispatch:

concurrency:
  group: flutter-native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native SDR++ DSP bridge
        run: cmake -S mobile/native -B build/native-host -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile native SDR++ DSP bridge
        run: cmake --build build/native-host --parallel 2
      - name: Run native DSP smoke tests
        run: ctest --test-dir build/native-host --output-on-failure

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_ui
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --org com.smallfishworld --project-name sdrpp_flutter --platforms=android .

      - name: Enable Android network and USB host access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />')
          if "android.hardware.usb.host" not in s:
              s = s.replace(
                  '<application',
                  '    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n\n'
                  '    <application',
                  1)
          s = s.replace('android:label="sdrpp_flutter"', 'android:label="SDR++ Receiver"')
          p.write_text(s)
          PY

          mkdir -p android/app/src/main/kotlin/com/smallfishworld/sdrpp_flutter
          cp ../tooling/flutter_android/MainActivity.kt              android/app/src/main/kotlin/com/smallfishworld/sdrpp_flutter/MainActivity.kt

      - name: Generate SDR++ Receiver branding
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 ../tooling/generate_branding.py

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android RTL-SDR USB dependencies
        shell: bash
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"

          DEPS="$PWD/build/rtl-sdr-usb-deps"
          rm -rf "$DEPS"
          mkdir -p "$DEPS"
          cd "$DEPS"

          git clone --depth 1 --branch v1.0.27             https://github.com/libusb/libusb.git libusb

          pushd libusb/android/jni
          "$NDK/ndk-build"             NDK_PROJECT_PATH=..             APP_ABI=arm64-v8a             APP_PLATFORM=android-24
          popd

          LIBUSB_SO="$DEPS/libusb/android/libs/arm64-v8a/libusb1.0.so"
          test -f "$LIBUSB_SO"

          git clone --depth 1             https://github.com/AlexandreRouma/rtl-sdr.git rtl-sdr

          cmake             -S rtl-sdr             -B rtl-sdr-build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DBUILD_UTILITIES=OFF             -DINSTALL_UDEV_RULES=OFF             -DLIBUSB_LIBRARIES="$LIBUSB_SO"             -DLIBUSB_INCLUDE_DIRS="$DEPS/libusb/libusb"             -DLIBUSB_INCLUDE_DIR="$DEPS/libusb/libusb"             -DLIBUSB_FOUND=1
          cmake --build rtl-sdr-build --parallel 2

          RTLSDR_SO="$(find rtl-sdr-build -name 'librtlsdr.so' -type f | head -n 1)"
          test -n "$RTLSDR_SO"
          test -f "$RTLSDR_SO"

          mkdir -p "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a"
          cp "$LIBUSB_SO"              "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/libusb1.0.so"
          cp "$RTLSDR_SO"              "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/librtlsdr.so"

          file             "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/libusb1.0.so"             "$GITHUB_WORKSPACE/flutter_ui/android/app/src/main/jniLibs/arm64-v8a/librtlsdr.so"

      - name: Build official SDR++ DSP native bridge
        shell: bash
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"
          cmake             -S ../mobile/native             -B build/sdrpp-native-arm64             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdrpp-native-arm64 --parallel 2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/sdrpp-native-arm64/libsdrpp_mobile.so              android/app/src/main/jniLibs/arm64-v8a/libsdrpp_mobile.so
          file android/app/src/main/jniLibs/arm64-v8a/libsdrpp_mobile.so

      - name: Verify complete SDR++ module mapping
        run: python3 ../tooling/check_module_catalog.py

      - name: Analyze Flutter app
        run: flutter analyze lib

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Name release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk              build/app/outputs/flutter-apk/SDRPP-Receiver-v0.6.0-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SDRPP-Receiver-Android
          path: flutter_ui/build/app/outputs/flutter-apk/SDRPP-Receiver-v0.6.0-native.apk
